<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Subtitles</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #fff;
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
        }
        .search-bar {
            margin-bottom: 30px;
        }
        .search-bar input {
            width: 100%;
            padding: 12px;
            background-color: #222;
            color: #fff;
            border: 1px solid #444;
            border-radius: 4px;
            font-size: 16px;
        }
        .search-bar input::placeholder {
            color: #888;
        }
        .section {
            margin-bottom: 40px;
        }
        .section-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #0066cc;
            border-bottom: 2px solid #0066cc;
            padding-bottom: 10px;
        }
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .video-card {
            background-color: #222;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .video-card:hover {
            transform: scale(1.05);
            background-color: #333;
        }
        .video-thumbnail {
            width: 100%;
            height: 150px;
            background-color: #444;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            background-size: cover;
            background-position: center;
        }
        .video-info {
            padding: 15px;
        }
        .video-title {
            font-weight: bold;
            margin-bottom: 5px;
        }
        .video-description {
            font-size: 12px;
            color: #aaa;
        }
        .player-section {
            background-color: #222;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            position: relative;
        }
        .player-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            height: 0;
        }
        .player-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 4px;
        }
        .subtitle-overlay {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            max-width: 95%;
            text-align: center;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            font-size: 18px;
            line-height: 1.4;
            z-index: 2147483647;
            pointer-events: none;
            font-weight: 500;
            word-wrap: break-word;
        }
        .hidden {
            display: none;
        }
        .fullscreen-subtitle-overlay {
            position: fixed;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            max-width: 90%;
            text-align: center;
            background: rgba(0, 0, 0, 0.9);
            padding: 20px;
            font-size: 22px;
            line-height: 1.5;
            color: #fff;
            z-index: 2147483647;
            display: none;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 1);
            word-wrap: break-word;
            pointer-events: none;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📺 Video Subtitles</h1>
        
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Search videos...">
        </div>
        
        <div id="playerSection" class="player-section hidden">
            <div class="player-wrapper">
                <iframe id="videoPlayer" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                <div class="subtitle-overlay" id="subtitleOverlay"></div>
            </div>
        </div>

        <div class="fullscreen-subtitle-overlay" id="fullscreenSubtitleOverlay"></div>

        <div id="videoSections"></div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        let player;
        let currentSubtitles = [];
        let subtitleUpdateInterval;
        let isFullscreen = false;
        let fullscreenCheckInterval;
        let messageListenerAttached = false;

        // YouTube IFrame API callback
        function onYouTubeIframeAPIReady() {
            console.log('YouTube IFrame API ready');
        }

        // Parse subtitles from format "00:00:00 - Text"
        function parseSubtitles(subtitleText) {
            return subtitleText.split('\n').map(line => {
                const match = line.match(/(\d{2}):(\d{2}):(\d{2})\s*-\s*(.*)/);
                if (match) {
                    const hours = parseInt(match[1]);
                    const minutes = parseInt(match[2]);
                    const seconds = parseInt(match[3]);
                    const text = match[4];
                    const totalSeconds = hours * 3600 + minutes * 60 + seconds;
                    return { time: totalSeconds, text };
                }
                return null;
            }).filter(Boolean);
        }

        // Get subtitle for current time
        function getSubtitleForTime(currentTime, subtitles) {
            for (let i = subtitles.length - 1; i >= 0; i--) {
                if (currentTime >= subtitles[i].time) {
                    return subtitles[i].text;
                }
            }
            return '';
        }

        // Update subtitle display
        function updateSubtitleDisplay(subtitleText) {
            document.getElementById('subtitleOverlay').textContent = subtitleText;
            document.getElementById('fullscreenSubtitleOverlay').textContent = subtitleText;
        }

        // Detect fullscreen by checking if iframe takes up most of the screen
        function checkFullscreen() {
            const iframe = document.getElementById('videoPlayer');
            const playerSection = document.getElementById('playerSection');
            if (!iframe || !playerSection) return;
            
            const rect = iframe.getBoundingClientRect();
            const windowHeight = window.innerHeight;
            const windowWidth = window.innerWidth;
            
            // Also check if player section is taking up most of the view
            const playerRect = playerSection.getBoundingClientRect();
            
            // Consider fullscreen if iframe covers 75%+ of screen or player is very large
            const iframeCoverage = (rect.height / windowHeight) * (rect.width / windowWidth);
            const playerCoverage = (playerRect.height / windowHeight) * (playerRect.width / windowWidth);
            const isFullscreenNow = iframeCoverage > 0.75 || playerCoverage > 0.75 || 
                                    (rect.height > windowHeight * 0.7 && rect.width > windowWidth * 0.7);
            
            if (isFullscreenNow !== isFullscreen) {
                isFullscreen = isFullscreenNow;
                const fsOverlay = document.getElementById('fullscreenSubtitleOverlay');
                fsOverlay.style.display = isFullscreen ? 'block' : 'none';
            }
        }

        // Detect fullscreen changes - standard API
        document.addEventListener('fullscreenchange', () => {
            isFullscreen = !!document.fullscreenElement;
            const fsOverlay = document.getElementById('fullscreenSubtitleOverlay');
            fsOverlay.style.display = isFullscreen ? 'block' : 'none';
        });

        // Also detect webkit fullscreen
        document.addEventListener('webkitfullscreenchange', () => {
            isFullscreen = !!document.webkitFullscreenElement;
            const fsOverlay = document.getElementById('fullscreenSubtitleOverlay');
            fsOverlay.style.display = isFullscreen ? 'block' : 'none';
        });

        // Firefox fullscreen
        document.addEventListener('mozfullscreenchange', () => {
            isFullscreen = !!document.mozFullScreenElement;
            const fsOverlay = document.getElementById('fullscreenSubtitleOverlay');
            fsOverlay.style.display = isFullscreen ? 'block' : 'none';
        });

        // Your video data organized by sections
        const videos = {
            "Action": [
                {
                    id: 1,
                    title: "",
                    description: "Description here",
                    youtubeId: "1daY8FvMHJs",
                    thumbnail: "https://img.youtube.com/vi/1daY8FvMHJs/maxresdefault.jpg",
                    subtitles: "00:00:00 - Hello everyone\n00:00:05 - Welcome to the channel\n00:00:10 - Today we're talking about..."
                },
                {
                    id: 2,
                    title: "Video Title 2",
                    description: "Another video",
                    youtubeId: "jNQXAC9IVRw",
                    thumbnail: "https://img.youtube.com/vi/jNQXAC9IVRw/maxresdefault.jpg",
                    subtitles: "00:00:00 - Start of video\n00:00:05 - This is an example subtitle"
                }
            ],
            "Songs": [
                {
                    id: 3,
                    title: "I want to be Honest with you",
                    description: "Hisame's song",
                    youtubeId: "9bZkp7q19f0",
                    thumbnail: "https://i.ytimg.com/vi/I32bpNXMV2I/maxresdefault.jpg",
                    subtitles: "00:00:00 - Video three begins\n00:00:10 - More subtitle text here"
                }
            ]
        };

        function initializeVideos() {
            const container = document.getElementById('videoSections');
            container.innerHTML = '';

            Object.keys(videos).forEach(section => {
                const sectionDiv = document.createElement('div');
                sectionDiv.className = 'section';
                sectionDiv.innerHTML = `<div class="section-title">${section}</div><div class="video-grid"></div>`;
                
                const grid = sectionDiv.querySelector('.video-grid');
                videos[section].forEach(video => {
                    const card = document.createElement('div');
                    card.className = 'video-card';
                    card.onclick = () => playVideo(video);
                    card.innerHTML = `
                        <div class="video-thumbnail" style="background-image: url('${video.thumbnail}');">▶️</div>
                        <div class="video-info">
                            <div class="video-title">${video.title}</div>
                            <div class="video-description">${video.description}</div>
                        </div>
                    `;
                    grid.appendChild(card);
                });
                container.appendChild(sectionDiv);
            });
        }

        function searchVideos(query) {
            const cards = document.querySelectorAll('.video-card');
            const sections = document.querySelectorAll('.section');
            
            // Clear player and subtitles if search filters videos
            if (query.trim() !== '') {
                document.getElementById('playerSection').classList.add('hidden');
                if (subtitleUpdateInterval) {
                    clearInterval(subtitleUpdateInterval);
                }
            }
            
            cards.forEach(card => {
                const title = card.querySelector('.video-title').textContent.toLowerCase();
                const description = card.querySelector('.video-description').textContent.toLowerCase();
                const matches = title.includes(query.toLowerCase()) || description.includes(query.toLowerCase());
                card.style.display = matches ? 'block' : 'none';
            });

            sections.forEach(section => {
                const visibleCards = section.querySelectorAll('.video-card[style*="display: block"]');
                const hasVisible = visibleCards.length > 0;
                section.style.display = hasVisible ? 'block' : 'none';
            });
        }

        function playVideo(video) {
            document.getElementById('playerSection').classList.remove('hidden');
            const iframe = document.getElementById('videoPlayer');
            iframe.src = `https://www.youtube.com/embed/${video.youtubeId}?enablejsapi=1`;
            
            // Parse and store current video's subtitles
            currentSubtitles = parseSubtitles(video.subtitles);
            
            // Clear any existing intervals
            if (subtitleUpdateInterval) {
                clearInterval(subtitleUpdateInterval);
            }
            if (fullscreenCheckInterval) {
                clearInterval(fullscreenCheckInterval);
            }
            
            // Track time since play started for subtitle sync
            let playStartTime = Date.now();
            let isPlaying = true;
            
            // Attach message listener only once
            if (!messageListenerAttached) {
                window.addEventListener('message', function handlePlayerState(event) {
                    if (typeof event.data === 'object' && event.data.event === 'infoDelivery') {
                        if (event.data.info && event.data.info.hasOwnProperty('currentTime')) {
                            const currentTime = event.data.info.currentTime;
                            const subtitleText = getSubtitleForTime(currentTime, currentSubtitles);
                            updateSubtitleDisplay(subtitleText);
                        }
                    }
                });
                messageListenerAttached = true;
            }
            
            // Fallback: Update subtitles every 100ms using elapsed time
            subtitleUpdateInterval = setInterval(() => {
                if (isPlaying) {
                    const elapsedSeconds = (Date.now() - playStartTime) / 1000;
                    const subtitleText = getSubtitleForTime(elapsedSeconds, currentSubtitles);
                    updateSubtitleDisplay(subtitleText);
                }
            }, 100);
            
            // Check for fullscreen mode every 250ms
            fullscreenCheckInterval = setInterval(() => {
                checkFullscreen();
            }, 250);
            
            window.scrollTo(0, 0);
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            searchVideos(e.target.value);
        });

        initializeVideos();
    </script>
</body>
</html>
