<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Subtitles</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #fff;
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
        }
        .search-bar {
            margin-bottom: 30px;
        }
        .search-bar input {
            width: 100%;
            padding: 12px;
            background-color: #222;
            color: #fff;
            border: 1px solid #444;
            border-radius: 4px;
            font-size: 16px;
        }
        .search-bar input::placeholder {
            color: #888;
        }
        .section {
            margin-bottom: 40px;
        }
        .section-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #0066cc;
            border-bottom: 2px solid #0066cc;
            padding-bottom: 10px;
        }
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .video-card {
            background-color: #222;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .video-card:hover {
            transform: scale(1.05);
            background-color: #333;
        }
        .video-thumbnail {
            width: 100%;
            height: 150px;
            background-color: #444;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            background-size: cover;
            background-position: center;
        }
        .video-info {
            padding: 15px;
        }
        .video-title {
            font-weight: bold;
            margin-bottom: 5px;
        }
        .video-description {
            font-size: 12px;
            color: #aaa;
        }
        .player-section {
            background-color: #222;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            position: relative;
        }
        .player-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            height: 0;
        }
        .player-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 4px;
        }
        .subtitle-overlay {
            position: absolute;
            bottom: 40px;
            left: 0;
            right: 0;
            text-align: center;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            font-size: 18px;
            line-height: 1.4;
            z-index: 10;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📺 Video Subtitles</h1>
        
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Search videos...">
        </div>
        
        <div id="playerSection" class="player-section hidden">
            <div class="player-wrapper">
                <iframe id="videoPlayer" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                <div class="subtitle-overlay" id="subtitleOverlay"></div>
            </div>
        </div>

        <div id="videoSections"></div>
    </div>

    <script>
        // Your video data organized by sections
        const videos = {
            "Action": [
                {
                    id: 1,
                    title: "",
                    description: "Description here",
                    youtubeId: "1daY8FvMHJs",
                    thumbnail: "https://img.youtube.com/vi/1daY8FvMHJs/maxresdefault.jpg",
                    subtitles: "00:00:00 - Hello everyone\n00:00:05 - Welcome to the channel\n00:00:10 - Today we're talking about..."
                },
                {
                    id: 2,
                    title: "Video Title 2",
                    description: "Another video",
                    youtubeId: "jNQXAC9IVRw",
                    thumbnail: "https://img.youtube.com/vi/jNQXAC9IVRw/maxresdefault.jpg",
                    subtitles: "00:00:00 - Start of video\n00:00:05 - This is an example subtitle"
                }
            ],
            "Songs": [
                {
                    id: 3,
                    title: "I want to be Honest with you",
                    description: "Hisame's song",
                    youtubeId: "9bZkp7q19f0",
                    thumbnail: "https://i.ytimg.com/vi/I32bpNXMV2I/maxresdefault.jpg",
                    subtitles: "00:00:00 - Video three begins\n00:00:10 - More subtitle text here"
                }
            ]
        };

        function initializeVideos() {
            const container = document.getElementById('videoSections');
            container.innerHTML = '';

            Object.keys(videos).forEach(section => {
                const sectionDiv = document.createElement('div');
                sectionDiv.className = 'section';
                sectionDiv.innerHTML = `<div class="section-title">${section}</div><div class="video-grid"></div>`;
                
                const grid = sectionDiv.querySelector('.video-grid');
                videos[section].forEach(video => {
                    const card = document.createElement('div');
                    card.className = 'video-card';
                    card.onclick = () => playVideo(video);
                    card.innerHTML = `
                        <div class="video-thumbnail" style="background-image: url('${video.thumbnail}');">▶️</div>
                        <div class="video-info">
                            <div class="video-title">${video.title}</div>
                            <div class="video-description">${video.description}</div>
                        </div>
                    `;
                    grid.appendChild(card);
                });
                container.appendChild(sectionDiv);
            });
        }

        function searchVideos(query) {
            const cards = document.querySelectorAll('.video-card');
            const sections = document.querySelectorAll('.section');
            
            cards.forEach(card => {
                const title = card.querySelector('.video-title').textContent.toLowerCase();
                const description = card.querySelector('.video-description').textContent.toLowerCase();
                const matches = title.includes(query.toLowerCase()) || description.includes(query.toLowerCase());
                card.style.display = matches ? 'block' : 'none';
            });

            sections.forEach(section => {
                const visibleCards = section.querySelectorAll('.video-card[style*="display: block"]');
                const hasVisible = visibleCards.length > 0;
                section.style.display = hasVisible ? 'block' : 'none';
            });
        }

        function playVideo(video) {
            document.getElementById('playerSection').classList.remove('hidden');
            document.getElementById('videoPlayer').src = `https://www.youtube.com/embed/${video.youtubeId}`;
            document.getElementById('subtitleOverlay').textContent = video.subtitles.split('\n')[0];
            window.scrollTo(0, 0);
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            searchVideos(e.target.value);
        });

        initializeVideos();
    </script>
</body>
</html>
